{% extends "base.html" %}
{% block content %}
<form action="/login" method="POST">
    <input name="username" type="text" placeholder="Enter Name">
    <input name="password" type="password" placeholder="Enter Password">
    <button id="submitbtn">Submit</button>
</form>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

{% endblock %}
