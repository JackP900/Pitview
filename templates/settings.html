{% extends "base.html" %}
{% block content %}
<div class="settings-card">
    <h2>Hardware Settings</h2>
    <form method="post" action="/save">
        <div class="form-group">
            <label for="portInput">Serial Port</label>
            <input id="portInput" name="port" type="text" value="{{ data.port }}">
            <span class="form-hint">e.g. /dev/cu.usbmodem1401</span>
        </div>
        <div class="form-group">
            <label for="baudInput">Baud Rate</label>
            <input id="baudInput" name="baud" type="number" value="{{ data.baud }}">
            <span class="form-hint">Typically 9600</span>
        </div>
        <button id="submitBtn">Save Settings</button>
    </form>
</div>
{% endblock %}
